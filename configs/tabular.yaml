random_seed: 42
patient_id_column: patient_id
label_column: label
split_column: split

logistic_regression:
  C: 1.0
  class_weight: balanced
  max_iter: 2000

xgboost:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1.0
  reg_alpha: 0.0
  reg_lambda: 1.0

calibration:
  method: sigmoid
