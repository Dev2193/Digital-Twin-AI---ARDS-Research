[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ards-ai-research"
version = "0.1.0"
description = "Privacy-safe research scaffolding for multimodal ARDS prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "xgboost>=2.0",
]

[project.optional-dependencies]
temporal = ["torch>=2.1"]
nlp = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ards-train-tabular = "ards_ai.cli.train_tabular:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ards_ai"]
